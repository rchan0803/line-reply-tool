<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LINE 返信案ツール</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Hiragino Sans', 'Meiryo', sans-serif; background: #f0f2f5; color: #333; height: 100vh; display: flex; flex-direction: column; }

  header {
    background: #00b900;
    color: white;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: bold; }
  header button {
    background: white;
    color: #00b900;
    border: none;
    border-radius: 6px;
    padding: 6px 14px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
  }
  header button:hover { background: #e8f5e9; }

  .main { display: flex; flex: 1; overflow: hidden; }

  /* ── 左：会話一覧 ── */
  .sidebar {
    width: 280px;
    background: white;
    border-right: 1px solid #e0e0e0;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .search-box { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  .search-box input {
    width: 100%;
    padding: 8px 12px;
    border: 1px solid #ddd;
    border-radius: 18px;
    font-size: 13px;
    outline: none;
  }
  .search-box input:focus { border-color: #00b900; }
  .conv-scroll { flex: 1; overflow-y: auto; }
  .conv-item {
    padding: 14px 16px;
    border-bottom: 1px solid #f5f5f5;
    cursor: pointer;
    transition: background 0.15s;
  }
  .conv-item:hover { background: #f9f9f9; }
  .conv-item.active { background: #e8f5e9; border-left: 3px solid #00b900; }
  .conv-name { font-weight: bold; font-size: 14px; margin-bottom: 4px; }
  .conv-preview { font-size: 12px; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-time { font-size: 11px; color: #bbb; margin-top: 4px; }
  .empty-state { padding: 40px 20px; text-align: center; color: #aaa; font-size: 14px; }

  /* ── 中央：やり取り ── */
  .chat-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-width: 320px;
  }
  .chat-header {
    padding: 10px 20px;
    background: white;
    border-bottom: 1px solid #e0e0e0;
    font-weight: bold;
    font-size: 15px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    min-height: 52px;
  }
  .call-name-box { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #666; font-weight: normal; }
  .call-name-box input {
    width: 160px;
    padding: 6px 10px;
    border: 1px solid #ddd;
    border-radius: 6px;
    font-size: 13px;
  }
  .call-name-box input:focus { outline: 1px solid #00b900; border-color: #00b900; }
  .btn-small {
    padding: 6px 12px;
    border: none;
    border-radius: 6px;
    background: #00b900;
    color: white;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
  }
  .btn-small:hover { opacity: 0.85; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .msg.inbound {
    background: white;
    border: 1px solid #e0e0e0;
    align-self: flex-start;
    border-radius: 2px 12px 12px 12px;
  }
  .msg.outbound {
    background: #dcf8c6;
    align-self: flex-end;
    border-radius: 12px 2px 12px 12px;
  }
  .msg-time { font-size: 11px; color: #aaa; margin-top: 3px; }
  .msg-wrapper { display: flex; flex-direction: column; }
  .msg-wrapper.inbound { align-items: flex-start; }
  .msg-wrapper.outbound { align-items: flex-end; }
  .chat-empty { color: #bbb; text-align: center; margin-top: 60px; font-size: 14px; }

  /* ── 右：返信案パネル ── */
  .draft-side {
    width: 420px;
    background: white;
    border-left: 2px solid #00b900;
    display: flex;
    flex-direction: column;
    padding: 16px;
    gap: 10px;
    flex-shrink: 0;
  }
  .draft-label {
    font-size: 13px;
    font-weight: bold;
    color: #00b900;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .draft-label span { color: #888; font-weight: normal; font-size: 11px; }
  #draft-text {
    flex: 1;
    background: #fdfced;
    border: 1px solid #e6ee9c;
    border-radius: 8px;
    padding: 14px;
    font-size: 14px;
    line-height: 1.8;
    white-space: pre-wrap;
    word-break: break-word;
    width: 100%;
    resize: none;
    font-family: inherit;
    min-height: 200px;
  }
  #draft-text:focus { outline: 2px solid #00b900; border-color: #00b900; }
  .draft-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn {
    padding: 10px 14px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: opacity 0.15s;
  }
  .btn:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-copy { background: #00b900; color: white; flex: 1; }
  .btn-regen { background: #f5f5f5; color: #555; border: 1px solid #ddd; }

  .ai-fix {
    border-top: 1px solid #eee;
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .ai-fix-label { font-size: 12px; font-weight: bold; color: #7b1fa2; }
  #instruction {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px;
    font-size: 13px;
    font-family: inherit;
    resize: none;
    line-height: 1.5;
  }
  #instruction:focus { outline: 2px solid #7b1fa2; border-color: #7b1fa2; }
  .btn-fix { background: #7b1fa2; color: white; }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #333;
    color: white;
    padding: 10px 18px;
    border-radius: 8px;
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
    z-index: 999;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<header>
  <h1>LINE 返信案ツール</h1>
  <button onclick="reloadManual()">マニュアル再読み込み</button>
</header>

<div class="main">
  <!-- 左：会話一覧 -->
  <div class="sidebar">
    <div class="search-box">
      <input id="search-input" type="text" placeholder="🔍 名前・メッセージを検索" oninput="onSearchInput()">
    </div>
    <div class="conv-scroll">
      <div id="conv-list"><div class="empty-state">メッセージなし</div></div>
    </div>
  </div>

  <!-- 中央：やり取り -->
  <div class="chat-panel">
    <div class="chat-header">
      <span id="chat-header-name">←左から会話を選択してください</span>
      <span class="call-name-box" id="call-name-box" style="display:none;">
        呼び名:
        <input id="call-name-input" placeholder="本名を設定（例：山田花子）">
        <button class="btn-small" onclick="saveCallName()">保存</button>
      </span>
    </div>
    <div class="chat-messages" id="messages-area"></div>
  </div>

  <!-- 右：返信案 -->
  <div class="draft-side">
    <div class="draft-label">
      返信案（編集できます）
      <span id="draft-time"></span>
    </div>
    <textarea id="draft-text" placeholder="会話を選択すると返信案が表示されます" oninput="draftEdited = true" disabled></textarea>
    <div class="draft-actions">
      <button class="btn btn-copy" id="copy-btn" onclick="copyDraft()" disabled>コピー（エルメに貼り付けて送信）</button>
      <button class="btn btn-regen" id="regen-btn" onclick="regenerate()" disabled>再生成</button>
    </div>
    <div class="ai-fix">
      <div class="ai-fix-label">🤖 AIに修正を指示</div>
      <textarea id="instruction" rows="2" placeholder="例：冒頭の挨拶を短くして／「70%オフ」の部分を削除して" disabled></textarea>
      <button class="btn btn-fix" id="fix-btn" onclick="refineDraft()" disabled>この指示で修正してもらう</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUserId = null;
let currentName = '';
let draftEdited = false;
let refreshTimer = null;
let searchTimer = null;

function formatTime(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const isToday = d.toDateString() === now.toDateString();
  if (isToday) return d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
  return d.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric' }) + ' ' +
         d.toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit' });
}

function escapeHtml(str) {
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── 会話一覧・検索 ─────────────────────────────

function onSearchInput() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadConversations, 300);
}

async function loadConversations() {
  const q = document.getElementById('search-input').value.trim();
  const url = q ? `/api/search?q=${encodeURIComponent(q)}` : '/api/conversations';
  const res = await fetch(url);
  const convs = await res.json();
  const list = document.getElementById('conv-list');
  if (convs.length === 0) {
    list.innerHTML = `<div class="empty-state">${q ? '該当する会話がありません' : 'まだメッセージがありません'}</div>`;
    return;
  }
  list.innerHTML = convs.map(c => {
    const label = c.call_name
      ? `${c.call_name}（${c.display_name || c.user_id}）`
      : (c.display_name || c.user_id);
    return `
    <div class="conv-item ${c.user_id === currentUserId ? 'active' : ''}"
         onclick="selectConv('${c.user_id}', '${escapeHtml(label).replace(/'/g, "\\'")}')">
      <div class="conv-name">${escapeHtml(label)}</div>
      <div class="conv-preview">${c.last_message ? escapeHtml(c.last_message.slice(0, 40)) : ''}</div>
      <div class="conv-time">${formatTime(c.last_at)}</div>
    </div>
  `;}).join('');
}

// ── 会話表示 ─────────────────────────────────

async function selectConv(userId, displayName) {
  currentUserId = userId;
  currentName = displayName;
  draftEdited = false;
  document.getElementById('chat-header-name').textContent = displayName;
  document.getElementById('call-name-box').style.display = 'flex';
  document.getElementById('call-name-input').value = '';
  ['draft-text', 'copy-btn', 'regen-btn', 'instruction', 'fix-btn'].forEach(id => {
    document.getElementById(id).disabled = false;
  });
  await loadConversations();
  await loadChat(true);
  startAutoRefresh();
}

async function saveCallName() {
  if (!currentUserId) return;
  const name = document.getElementById('call-name-input').value.trim();
  try {
    const res = await fetch(`/api/call-name/${currentUserId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    if (!res.ok) throw new Error();
    showToast(name ? `呼び名を「${name}」に設定しました。「再生成」で反映されます` : '呼び名を削除しました');
    await loadConversations();
  } catch (e) {
    showToast('エラーが発生しました');
  }
}

function startAutoRefresh() {
  if (refreshTimer) clearInterval(refreshTimer);
  refreshTimer = setInterval(() => {
    loadConversations();
    if (currentUserId) loadChat(false);
  }, 10000);
}

async function loadChat(force) {
  if (!currentUserId) return;
  const res = await fetch(`/api/messages/${currentUserId}`);
  const data = await res.json();

  // 中央のやり取りは常に最新化
  const area = document.getElementById('messages-area');
  const nearBottom = area.scrollHeight - area.scrollTop - area.clientHeight < 80;
  area.innerHTML = data.messages.map(m => `
    <div class="msg-wrapper ${m.direction}">
      <div class="msg ${m.direction}">${escapeHtml(m.content)}</div>
      <div class="msg-time">${formatTime(m.created_at)}</div>
    </div>
  `).join('') || '<div class="chat-empty">メッセージなし</div>';
  if (force || nearBottom) area.scrollTop = area.scrollHeight;

  // 返信案は編集中でなければ更新
  const ta = document.getElementById('draft-text');
  const editing = draftEdited || document.activeElement === ta;
  if (force || !editing) {
    ta.value = data.draft ? data.draft.content : '';
    draftEdited = false;
    document.getElementById('draft-time').textContent =
      data.draft ? `生成: ${formatTime(data.draft.created_at)}` : '';
  }

  // 呼び名欄（入力中でなければ最新化）
  const cn = document.getElementById('call-name-input');
  if (data.user && document.activeElement !== cn) {
    cn.value = data.user.call_name || '';
  }
}

// ── ボタン操作 ─────────────────────────────────

function copyDraft() {
  const text = document.getElementById('draft-text').value;
  if (!text) { showToast('コピーする返信案がありません'); return; }
  navigator.clipboard.writeText(text).then(() => showToast('コピーしました'));
}

async function regenerate() {
  if (!currentUserId) return;
  const btn = document.getElementById('regen-btn');
  btn.disabled = true;
  btn.textContent = '生成中...';
  try {
    const res = await fetch(`/api/regenerate/${currentUserId}`, { method: 'POST' });
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('draft-text').value = data.draft;
    draftEdited = false;
    document.getElementById('draft-time').textContent = `生成: ${formatTime(new Date().toISOString())}`;
    showToast('返信案を再生成しました');
  } catch (e) {
    showToast('エラーが発生しました');
  } finally {
    btn.disabled = false;
    btn.textContent = '再生成';
  }
}

async function refineDraft() {
  if (!currentUserId) return;
  const instructionEl = document.getElementById('instruction');
  const instruction = instructionEl.value.trim();
  if (!instruction) { showToast('修正内容を入力してください'); return; }
  const btn = document.getElementById('fix-btn');
  btn.disabled = true;
  btn.textContent = 'AIが修正中...';
  try {
    const res = await fetch(`/api/refine/${currentUserId}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        instruction: instruction,
        draft: document.getElementById('draft-text').value,
      }),
    });
    if (!res.ok) throw new Error();
    const data = await res.json();
    document.getElementById('draft-text').value = data.draft;
    draftEdited = false;
    instructionEl.value = '';
    document.getElementById('draft-time').textContent = `生成: ${formatTime(new Date().toISOString())}`;
    showToast('修正しました');
  } catch (e) {
    showToast('エラーが発生しました');
  } finally {
    btn.disabled = false;
    btn.textContent = 'この指示で修正してもらう';
  }
}

async function reloadManual() {
  try {
    const res = await fetch('/api/reload-manual', { method: 'POST' });
    const data = await res.json();
    showToast(`マニュアル再読み込み完了（${data.characters.toLocaleString()}文字）`);
  } catch (e) {
    showToast('エラーが発生しました');
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// 初回ロード
loadConversations();
setInterval(loadConversations, 15000);
</script>
</body>
</html>
